        end_date: present
        summary: Advised by Prof. Jiatao Gu.
        highlights:
          - "Designing a continuous latent chain-of-thought reasoning pipeline on a Qwen3-8B backbone that operates in a lower-dimensional space while preserving semantic structure."
          - "Fine-tuning an LLM-based VAE encoder to provide semantic guidance for latent thinking-token generation; using normalizing flows to autoregressively generate thinking tokens under an MSE objective against VAE-encoded latents."
          - "Computing step-wise log-likelihoods to enable reinforcement learning over reasoning trajectories, with evaluation protocols for trajectory selection."
      - company: McAuley Lab, UC San Diego
        position: Undergraduate Researcher
        location: San Diego, CA
        start_date: 2024
        end_date: 2025
        summary: Advised by Prof. Julian McAuley and Yupeng Hou.
        highlights:
          - "Built an evaluation framework for benchmarking LLM text embeddings in retrieval and recommendation, including a public Amazon dataset with 2M+ training and 250K+ test instances."
          - "Benchmarked embeddings from SimCSE, E5-Mistral-7B, text-embedding-3-large, Qwen-7B, Gemini, and OpenAI across collaborative filtering, sequential recommendation, and product search; co-first-authored the resulting ACL 2026 paper."
      - company: Shang Data Lab, UC San Diego
        position: Undergraduate Researcher
        location: San Diego, CA
        start_date: 2023
        end_date: 2024
        summary: Advised by Prof. Jingbo Shang and Letian Peng.
        highlights:
          - "Refined weakly supervised text classification, reaching 93% peak accuracy on AG News (vs. 78% baseline) via KL-divergence matching between token-level text and class-prompt distributions."
          - "Implemented the framework in PyTorch with BERT, RoBERTa, and Gemma across AG News and Rotten Tomatoes."

