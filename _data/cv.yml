    Experience:
      - company: GMLR Lab, University of Pennsylvania
        position: Graduate Researcher
        location: Philadelphia, PA
        start_date: 2025
        end_date: present
        summary: Advised by Prof. Jiatao Gu.
        highlights:
          - "Co-led Latent Reasoning with Normalizing Flows (co-first author), embedding an autoregressive normalizing flow in the causal stream of Qwen3-8B for continuous latent chain-of-thought reasoning with exact, tractable likelihoods."
          - "Fine-tuned an LLM-based VAE to compress explicit reasoning trajectories into structured latents, then trained prompt-conditioned flows with a unified flow + cross-entropy objective on 732K code-reasoning samples (8×B200, FSDP)."
          - "Leveraged step-wise latent log-likelihoods for density-based trajectory reranking and reinforcement learning over continuous reasoning paths; extended evaluation to math reasoning (AIME, MATH500, OlympiadBench)."
          - "Co-developed Decoupled Reading, enabling demonstration-conditioned robot manipulation policies to follow longer skill compositions than those seen in training."
      - company: McAuley Lab, UC San Diego
        position: Undergraduate Researcher
        location: San Diego, CA
        start_date: 2024
        end_date: 2025
        summary: Advised by Prof. Julian McAuley and Dr. Yupeng Hou.
        highlights:
          - "Co-first author on a large-scale benchmark evaluating LLMs as semantic encoders across retrieval and recommendation tasks."
          - "Built a [public Amazon dataset](https://huggingface.co/datasets/McAuley-Lab/Amazon-Reviews-2023) with 2M+ training and 250K+ testing instances spanning collaborative filtering, sequential recommendation, and product search."
          - "Evaluated embeddings from SimCSE, E5-Mistral-7B, Qwen-7B, Gemini, and OpenAI models, analyzing their effectiveness across recommendation and retrieval settings."
      - company: Shang Data Lab, UC San Diego
        position: Undergraduate Researcher
        location: San Diego, CA
        start_date: 2023
        end_date: 2024
        summary: Advised by Prof. Jingbo Shang and PhD candidate Letian Peng.
        highlights:
          - "Developed a weakly supervised text classification framework using KL-divergence alignment between token-level representations and class-prompt distributions, improving AG News accuracy from 78% to 93%."
          - "Implemented and evaluated the framework in PyTorch across BERT, RoBERTa, and Gemma on AG News and Rotten Tomatoes."

