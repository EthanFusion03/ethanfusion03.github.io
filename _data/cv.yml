  sections:
    Education:
      - institution: University of Pennsylvania
        url: https://www.upenn.edu/
        logo: penn-shield.png
        degree: M.S.E.
        area: Computer & Information Science
        location: Philadelphia, PA
        dates: Aug 2025 – May 2027
        highlights:
          - "GPA: 3.95 / 4.0"
      - institution: University of California, San Diego
        url: https://ucsd.edu/
        logo: ucsd-seal.png
        degree: B.S.
        area: Mathematics–Computer Science
        location: San Diego, CA
        dates: Sep 2021 – Jun 2025
        highlights:
