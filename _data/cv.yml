  summary: >-
    M.S.E. student in Computer & Information Science at the University of
    Pennsylvania. I work on latent reasoning for large language models —
    continuous chain-of-thought via normalizing flows — and previously on
    benchmarking LLMs as semantic encoders for retrieval and recommendation.

  social_networks:
