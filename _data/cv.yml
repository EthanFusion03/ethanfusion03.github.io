      username: EthanFusion03

  coursework: "Statistical NLP, Deep Learning, Deep Generative Modeling, Computer Vision, Reinforcement Learning, Recommender Systems & Web Mining, Machine Learning, Discrete Mathematics & Graph Theory, Probability & Statistics"

